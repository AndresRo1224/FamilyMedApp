{% extends "cms/base.html" %}

{% block cms_content %}
<div class="card" style="background-color: var(--surface, #fff); padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 600px; border-top: 4px solid #dc2626;">
  <h2 style="margin-top:0; color: #dc2626;">¿Estás seguro?</h2>
  <p style="margin-bottom: 24px;">
    Vas a eliminar permanentemente:
    <br>
    <strong style="font-size: 16px;">{{ item_label }}</strong>
  </p>
  <p style="background:#fef3c7; border:1px solid #fbbf24; padding:10px; border-radius:6px; margin-bottom:24px;">
    Esta acción no se puede deshacer.
  </p>

  <form method="post">
    {% csrf_token %}
    <div style="display:flex; gap:10px;">
      <button
        type="submit"
        style="background:#dc2626; color:#fff; padding:10px 20px; border-radius:6px; border:none; cursor:pointer; font-weight:600;"
      >
        Sí, eliminar
      </button>
      <a href="{{ cancel_url }}" class="btn btn-default" style="padding:10px 20px;">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
